<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes imagiers de français - CP</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --secondary-color: #F5A623;
      --bg-color: #F7F9FC;
      --card-bg: #FFFFFF;
      --text-color: #2C3E50;
      --border-radius: 12px;
    }

    body {
      font-family: 'Segoe UI', Comic Sans MS, 'Chalkboard SE', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #666;
    }

    .grid-container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      padding: 25px 20px;
      text-align: center;
      text-decoration: none;
      color: var(--text-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      border-color: var(--primary-color);
    }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }

    .card-title-fr {
      font-size: 1.3rem;
      font-weight: bold;
      color: #1E3A8A;
      margin-bottom: 5px;
    }

    .card-title-cn {
      font-size: 1.1rem;
      color: #D97706;
    }

    .card-pinyin {
      font-size: 0.9rem;
      color: #9CA3AF;
      margin-top: 2px;
    }

    .btn-ouvrir {
      margin-top: 15px;
      background-color: var(--secondary-color);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>📚 Mes imagiers de français / 我的法语识字卡</h1>
    <p class="subtitle">Choisis un thème pour réviser ton vocabulaire !</p>
  </header>

  <div class="grid-container">

    <!-- PAGE 1 : MATÉRIEL SCOLAIRE -->
    <a href="MaterielScolaire.html" class="card">
      <div class="card-icon">🎒</div>
      <div class="card-title-fr">LE MATÉRIEL</div>
      <div class="card-title-cn">学校用品</div>
      <div class="card-pinyin">xué xiào yòng pǐn</div>
      <div class="btn-ouvrir">Voir / 查看</div>
    </a>

    <!-- PAGE 2 : LES ANIMAUX -->
    <a href="Animaux.html" class="card">
      <div class="card-icon">🦁</div>
      <div class="card-title-fr">LES ANIMAUX</div>
      <div class="card-title-cn">动物</div>
      <div class="card-pinyin">dòng wù</div>
      <div class="btn-ouvrir">Voir / 查看</div>
    </a>

    <!-- PAGE 3 : LA POLITESSE -->
    <a href="FormulesPolitesse.html" class="card">
      <div class="card-icon">🤝</div>
      <div class="card-title-fr">LA POLITESSE</div>
      <div class="card-title-cn">礼貌用语</div>
      <div class="card-pinyin">lǐ mào yòng yǔ</div>
      <div class="btn-ouvrir">Voir / 查看</div>
    </a>

    <!-- PAGE 4 : LES COULEURS -->
    <a href="Couleurs.html" class="card">
      <div class="card-icon">🎨</div>
      <div class="card-title-fr">LES COULEURS</div>
      <div class="card-title-cn">颜色</div>
      <div class="card-pinyin">yán sè</div>
      <div class="btn-ouvrir">Voir / 查看</div>
    </a>

    <!-- POUR RAJOUTER UNE NOUVELLE PAGE PLUS TARD, DUPLIQUEZ CE BLOC :
    <a href="nom-de-page.html" class="card">
      <div class="card-icon">ÉMOJI</div>
      <div class="card-title-fr">TITRE FR</div>
      <div class="card-title-cn">titre cn</div>
      <div class="card-pinyin">pinyin</div>
      <div class="btn-ouvrir">Voir / 查看</div>
    </a>
    -->

  </div>

</body>
</html>
